/* ---------- Persistence ---------- */
/* C1: Recursively fill any missing keys from the default schema while
   preserving every value the user actually saved. Prevents crashes when a
   stored state predates newer modules / is partially corrupted. */
function mergeDefaults(def, saved) {
  if (saved === undefined || saved === null) return def;          // missing -> default
  if (Array.isArray(def)) return Array.isArray(saved) ? saved : def;
  if (def && typeof def === 'object') {
    if (typeof saved !== 'object' || Array.isArray(saved)) return def;
    const out = { ...saved };                                     // keep all stored keys
    for (const k in def) out[k] = mergeDefaults(def[k], saved[k]); // ensure schema keys exist
    return out;
  }
  return saved;                                                   // primitive present -> keep user's value
}
function load() {
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(KEY)); } catch { saved = null; }
  S = mergeDefaults(defaultState(), saved);
}
/* C2: never let a storage failure (quota / private mode / disabled) break a flow. */
function save() {
  try {
    localStorage.setItem(KEY, JSON.stringify(S));
  } catch (e) {
    console.warn('Ascendra: could not persist state —', e && e.name);
    if (typeof toast === 'function') toast('Couldn\u2019t save — storage may be full or blocked.', 'x');
  }
}
function reset() {
  try { localStorage.removeItem(KEY); } catch (e) { console.warn('Ascendra: reset failed', e); }
  S = defaultState();
}

/* ---------- Derived values ---------- */
function streakDays() {
  const base = S.lastRelapse || S.startDate;
  return Math.max(0, daysBetween(base, todayKey()));
}
function level() {
  // 100 XP for L1, growing
  let xp = S.xp, lvl = 1, need = 100;
  while (xp >= need) { xp -= need; lvl++; need = Math.round(need * 1.35); }
  return { lvl, into: xp, need, pct: Math.round((xp / need) * 100) };
}
function addXP(n, reason) {
  S.xp += n; save();
  toast(`+${n} XP · ${reason}`, 'spark');
  checkBadges();
}
function recoveryScore() {
  const sd = clamp(streakDays(), 0, 90) / 90 * 40;          // up to 40
  const recentMood = S.moods.slice(-7);
  const moodAvg = recentMood.length ? recentMood.reduce((a, m) => a + m.mood, 0) / recentMood.length : 3;
  const moodPts = (moodAvg / 5) * 20;                        // up to 20
  const ci = Object.keys(S.checkins).length; const ciPts = clamp(ci, 0, 14) / 14 * 20; // 20
  const hab = clamp(habitTotalDone(), 0, 20) / 20 * 20;     // 20
  return Math.round(clamp(sd + moodPts + ciPts + hab, 0, 100));
}
function habitTotalDone() { return S.habits.reduce((a, hb) => a + Object.keys(hb.done).length, 0); }
function moneySaved() {
  const a = ADDICTIONS[S.profile.addiction];
  if (!a || !a.savesMoney) return 0;
  return streakDays() * (a.perDay || 10);
}
function timeRecovered() {
  // rough: 2.5h/day reclaimed
  return Math.round(streakDays() * 2.5);
}
function relapseRisk() {
  let risk = 20;
  const recent = S.triggers.slice(-5);
  const avgInt = recent.length ? recent.reduce((a, t) => a + t.intensity, 0) / recent.length : 0;
  risk += avgInt * 6;
  const lastMood = S.moods.slice(-1)[0];
  if (lastMood) { risk += (5 - lastMood.mood) * 5; risk += lastMood.stress * 3; }
  if (streakDays() < 7) risk += 12;
  // protective factors
  risk -= clamp(habitTotalDone(), 0, 10);
  return clamp(Math.round(risk), 3, 96);
}

  let gained = [];
  BADGE_DEFS.forEach(b => { if (!S.badges.includes(b.id) && b.need(S)) { S.badges.push(b.id); gained.push(b); } });
  if (gained.length) { save(); gained.forEach(b => toast(`Badge unlocked: ${b.emoji} ${b.name}`, 'trophy')); confetti(); }
}

function confetti() {
  // M1: respect users who prefer reduced motion (a11y + perf on low-end devices).

}
function modal(contentNode, opts = {}) {
  const back = h('div', { class: 'fixed inset-0 z-[80] bg-black/50 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4 fade-in',
    onclick: e => { if (e.target === back && !opts.locked) close(); } });
  // Accessibility: hide main app while modal is open and remember focus
  const prevActive = document.activeElement;
  const appEl = document.getElementById('app');
  if (appEl) appEl.setAttribute('aria-hidden', 'true');
  const panel = h('div', { class: `sheet-enter w-full ${opts.wide ? 'sm:max-w-2xl' : 'sm:max-w-md'} bg-white dark:bg-slate-900 rounded-t-3xl sm:rounded-3xl shadow-2xl border border-slate-200 dark:border-slate-800 max-h-[92vh] overflow-y-auto` });
  function close() { back.style.opacity = '0'; setTimeout(() => back.remove(), 200); document.removeEventListener('keydown', onKey); opts.onClose && opts.onClose(); }
  // restore focus and aria state
  const _origClose = close;
  function closeAndRestore() { _origClose(); try { if (appEl) appEl.removeAttribute('aria-hidden'); if (prevActive && typeof prevActive.focus === 'function') prevActive.focus(); } catch (e) {} }
  function onKey(e) { if (e.key === 'Escape' && !opts.locked) close(); }
  document.addEventListener('keydown', onKey);
  panel.appendChild(contentNode(closeAndRestore));
  back.appendChild(panel); document.body.appendChild(back);
  return closeAndRestore;
}

   VIEW: AI RECOVERY COACH (rule-based responder)
   ============================================================ */
function coachReply(text) {
  const t = text.toLowerCase();
  const name = S.profile.name ? ', ' + S.profile.name : '';
  const sd = streakDays();
  const pick = arr => arr[Math.floor(Math.random()*arr.length)];

  if (/urge|crav|want to|tempt|relapse|slip/.test(t))
    return `That urge is real, but it is temporary — most peak and fade within 15-20 minutes${name}. Tap the red shield for a guided urge-surf, or try this now: stand up, take 5 slow breaths, and drink a glass of water. You are on day ${sd}. Try one now: (1) Open Sessions → Box Breathing, (2) or open Motivation → play a quick clip. Want me to walk you through a breathing exercise?`;
  if (/sad|depress|down|hopeless|worthless|empty|cry/.test(t))
    return `I'm really glad you told me${name}. Those heavy feelings are common in recovery as your brain rebalances its chemistry — it does get better. Be gentle with yourself today. Could you do one small kind thing for yourself in the next hour? If these feelings stay intense or you ever think of harming yourself, please reach a crisis line (e.g. dial 988 in the US). You matter.`;
  if (/anx|stress|overwhelm|panic|nervous/.test(t))
    return `Let's bring that stress down a notch${name}. Try box breathing with me: in for 4, hold 4, out for 6. Stress is one of your logged triggers, so this is exactly the moment your skills matter most. What's weighing on you right now — maybe we can break it into one small next step?`;
  if (/bored|nothing to do|boredom/.test(t))
    return `Boredom is sneaky — it's a top relapse trigger because the brain looks for a quick dopamine hit. Let's redirect it: a 10-minute walk, 20 push-ups, message a friend, or start a short Academy lesson. Want me to open Sessions or Motivation for a quick guided exercise or clip?`;
  if (/relaps|messed up|failed|gave in|broke my streak/.test(t))
    return `Thank you for being honest${name}. A slip is data, not a verdict — it tells us what to strengthen. What happened right before? If we can name the trigger, we can build a plan so it doesn't catch you the same way again. You are not starting over; you're starting with experience. If you want, open the relapse logger now so we can record triggers and plan a specific next step.`;
  if (/proud|good day|great|happy|amazing|won|resisted|beat/.test(t))
    return `That's fantastic${name}! 🎉 Savor this — your brain is literally rewiring toward freedom every time you choose recovery. Take a mental snapshot of how good this feels so you can recall it during a hard moment. What helped you today?`;
  if (/why|point|worth it|give up|quit/.test(t))
    return `Here's your own reason, in your words: "${S.profile.why||'to become who you know you can be'}." That's worth more than any craving. Day ${sd} is proof you can do hard things. Let's keep your momentum — want a quick win for today?`;
  if (/sleep|tired|insomnia|can't sleep/.test(t))
    return `Sleep struggles are very common early in recovery and they pass. Tonight: no screens 30 min before bed (Focus Mode can help), dim lights, and try the breathing exercise lying down. Your reclaimed evenings are a perfect time to build a calming wind-down ritual.`;
  if (/help|what can you|how do you|guide/.test(t))
    return `I'm your 24/7 recovery coach${name}. I can help you ride out urges, manage triggers and stress, review your progress, set goals, plan your day, and keep you motivated. Try: 'I have an urge', 'Open Sessions', or 'Show motivation'. Just talk to me like a person. What's on your mind?`;
  if (/hi|hello|hey|good morning|good evening/.test(t))
    return `Hey${name}! Day ${sd} and showing up — that's what counts. How are you feeling right now, honestly?`;
  if (/plan|today|what should i|productive/.test(t))
    return `Let's make today a win${name}. Try this: ✅ Daily check-in, ✅ one guided session, ✅ knock out your habits, ✅ one Academy lesson. Small consistent actions compound. Want me to open your program for today? I can open Sessions or Motivation for a quick start.`;
  return pick([
    `I hear you${name}. Tell me more — what's underneath that feeling?`,
    `That makes sense. In recovery, naming what we feel takes its power away. How is this affecting you today?`,
    `Thanks for sharing that. On day ${sd}, you've already proven you can handle hard things. What would help most right now — calming down, a distraction, or a plan?`,
    `If you'd like a quick reset, type 'I have an urge' or ask me to open Sessions or Motivation — I can guide you through it in-app.`,
  ]);
}

// Async: try server proxy first (if configured), otherwise use local rule-based reply
async function getCoachReply(text) {
  try {
    const url = (S && S.settings && S.settings.coachServerUrl) ? S.settings.coachServerUrl.trim() : '';
    const secret = (S && S.settings && S.settings.coachApiSecret) ? S.settings.coachApiSecret.trim() : '';
    if (url && S.settings.coachConsent) {
      // Normalize URL
      const endpoint = url.replace(/\/$/, '') + '/api/coach';
      const body = { message: text, sessionId: (S._coachSessionId || '') };
      const headers = { 'Content-Type': 'application/json' };
      if (secret) headers['x-api-secret'] = secret;
      const resp = await fetch(endpoint, { method: 'POST', headers, body: JSON.stringify(body) });
      if (!resp.ok) {
        throw new Error('Server responded '+resp.status);
      }
      const data = await resp.json();
      if (data && data.reply) return data.reply;
      throw new Error('Invalid server response');
    }
  } catch (e) {
    console.warn('Coach proxy failed:', e && e.message);
    // fall through to local reply
  }
  return coachReply(text);
}

        S.coachLog.push({ role: 'coach', text: 'Sorry — the remote coach is unavailable. ' + fallback });
        paintLog(); save();
      }
    })();
  }

  paintLog();
  wrap.append(head, log, chips, h('div', { class: 'flex gap-2 pt-1' }, input, sendBtn));
  c.appendChild(wrap);
};

function startSession(s) {
  let _iv;
  modal((close) => {
    const root = h('div', { class: 'p-6 text-center' });
    let total = s.dur * 60, left = total, playing = true;
    const ring = h('div', { class: 'mx-auto my-4' });
    const time = h('div', { class: 'text-4xl font-extrabold tabular-nums' }, `${s.dur}:00`);
    const phase = h('p', { class: 'text-sm text-slate-500 mt-2 max-w-xs mx-auto' }, 'Find a comfortable position. Close your eyes if you can. Let\'s begin.');
    function drawRing() { ring.innerHTML=''; ring.appendChild(ringSVG((1-left/total)*100, s.color, 160, `${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}`, s.name)); }
    drawRing();
    const cues = ['Breathe slowly and deeply...','Notice any tension and let it soften...','You are safe in this moment...','Every breath strengthens your recovery...','Let thoughts pass like clouds...','You are exactly where you need to be...'];
    let ci=0;
    _iv = setInterval(() => { if(!playing) return; left--; drawRing();
      if (left % 25 === 0) { phase.textContent = cues[ci++ % cues.length]; }
      if (left <= 0) { clearInterval(_iv); phase.textContent = 'Session complete. Beautiful work. 🌿'; addXP(20, s.name+' done');
        const today=todayKey(); S.checkins[today]=S.checkins[today]||{sessions:[]}; (S.checkins[today].sessions=S.checkins[today].sessions||[]).push(s.id); save(); confetti(); } }, 1000);
    const pauseBtn = h('button', { class: 'w-14 h-14 rounded-full bg-brand-600 text-white grid place-items-center mx-auto active:scale-95', onclick: e => { playing=!playing; pauseBtn.innerHTML=''; pauseBtn.appendChild(icon(playing?'pause':'play','w-7 h-7')); } }, icon('pause','w-7 h-7'));
    root.append(
      h('button', { class: 'flex items-center gap-1 text-sm text-slate-400 mb-2', onclick: () => { clearInterval(_iv); close(); } }, icon('x','w-4 h-4'),'End session'),
      h('h2',{class:'text-xl font-bold'}, s.name), ring, phase, h('div',{class:'mt-6'}, pauseBtn));
    return root;
  }, { wide: false, onClose: () => clearInterval(_iv) });
}

const TYPE_BADGE = { discussion:['Discussion','#6366f1'], question:['Question','#0ea5e9'], motivation:['Win','#10b981'], story:['Story','#f59e0b'], challenge:['Challenge','#ef4444'] };

function postCard(p, expanded) {
  const g = groupById(p.gid);
  const [tlabel, tcolor] = TYPE_BADGE[p.type] || TYPE_BADGE.discussion;
  const body = h('div', { class:'flex items-start gap-3' },
    h('button', { class:'w-9 h-9 rounded-full grid place-items-center text-white text-xs font-bold shrink-0', style:`background:${avatarColor(p.author)}`, onclick:()=>{ if(!p.mine) cgo({screen:'profile', author:p.author}); } }, p.author[0].toUpperCase()),
    h('div', { class:'flex-1 min-w-0' },
      h('div', { class:'flex items-center gap-2 flex-wrap' },
        h('span', { class:'text-sm font-bold' }, p.author),
        h('span', { class:'text-[11px] text-slate-400' }, (g?g.name+' \u00b7 ':'')+p.ago),
        h('span', { class:'text-[10px] font-bold px-2 py-0.5 rounded-full', style:`background:${tcolor}22;color:${tcolor}` }, tlabel)),
      h('p', { class:`text-sm mt-2 leading-relaxed whitespace-pre-line ${expanded?'':'line-clamp-5'}` }, p.text),
      h('div', { class:'flex items-center gap-4 mt-3 text-slate-400' },
        h('button', { class:`flex items-center gap-1 text-xs font-semibold ${p.liked?'text-rose-500':'hover:text-rose-500'}`, onclick:function(){ p.liked=!p.liked; p.likes+=p.liked?1:-1; save(); this.classList.toggle('text-rose-500',p.liked); this.lastChild.textContent=String(p.likes); } }, icon('heart','w-4 h-4'), h('span',{}, String(p.likes))),
        h('button', { class:'flex items-center gap-1 text-xs font-semibold hover:text-brand-600', onclick:()=>cgo({screen:'post', gid:p.gid, postId:p.id}) }, icon('coach','w-4 h-4'), h('span',{}, p.comments.length+' '+(p.comments.length===1?'reply':'replies'))) )));
  return h('div', { class:`card rounded-3xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-4 ${p.type==='challenge'?'ring-1 ring-amber-300 dark:ring-amber-700':''}` }, body);
}

function communityPost(c, gid, postId) {
  ensureGroupSeed(gid);
  const p = S.cstate.posts[gid].find(x => x.id === postId);
  if (!p) { cgo({screen:'group', gid}); return; }
  c.appendChild(h('button', { class:'flex items-center gap-1 text-sm text-slate-400 hover:text-slate-600 mb-3', onclick:()=>cgo({screen:'group', gid}) }, icon('home','w-4 h-4'), 'Back to '+groupById(gid).name));
  c.appendChild(postCard(p, true));

  // Comments
  c.appendChild(h('h2', { class:'text-sm font-bold mt-5 mb-2' }, `Replies (${p.comments.length})`));
  const list = h('div', { class:'space-y-3' });
  const paint = () => { list.innerHTML='';
    if (!p.comments.length) list.appendChild(h('div', { class:'text-sm text-slate-400 text-center py-4' }, 'Be the first to reply with support \uD83D\uDCAA'));
    p.comments.forEach(cm => list.appendChild(h('div', { class:'flex items-start gap-3' },
      h('button', { class:'w-8 h-8 rounded-full grid place-items-center text-white text-[11px] font-bold shrink-0', style:`background:${avatarColor(cm.author)}`, onclick:()=>{ if(!cm.mine) cgo({screen:'profile', author:cm.author}); } }, cm.author[0].toUpperCase()),
      h('div', { class:'flex-1 rounded-2xl bg-slate-50 dark:bg-slate-800/60 px-4 py-2.5' },
        h('div', { class:'flex items-center gap-2' }, h('span', { class:'text-sm font-bold' }, cm.author), h('span', { class:'text-[11px] text-slate-400' }, cm.ago)),
        h('p', { class:'text-sm mt-1 leading-relaxed' }, cm.text),
        h('button', { class:`flex items-center gap-1 text-xs font-semibold mt-2 ${cm.liked?'text-rose-500':'text-slate-400 hover:text-rose-500'}`, onclick:function(){ cm.liked=!cm.liked; cm.likes+=cm.liked?1:-1; save(); this.classList.toggle('text-rose-500',cm.liked); this.lastChild.textContent=String(cm.likes); } }, icon('heart','w-3.5 h-3.5'), h('span',{}, String(cm.likes)))))));
  };
  paint();
  c.appendChild(list);

  // Add comment
  const ta = h('textarea', { class:'w-full rounded-2xl border border-slate-300 dark:border-slate-700 bg-transparent px-4 py-3 h-16 resize-none', placeholder:'Write a supportive reply...' });
  c.appendChild(h('div', { class:'mt-4' }, ta,
    h('div', { class:'flex justify-end mt-2' }, btn('Reply', ()=>{
      if (!ta.value.trim()) { toast('Write a reply first','x'); return; }
      p.comments.push({ id:uid(), author:(S.profile.name?S.profile.name:'You')+' (you)', ago:'now', text:ta.value.trim(), likes:0, liked:false, mine:true });
      addXP(5,'Community reply'); save(); ta.value=''; paint();
      c.querySelector('h2').textContent = `Replies (${p.comments.length})`;
      toast('Reply posted \uD83D\uDCAC','check');
    }, 'primary', 'coach'))));
}

function communityProfile(c, name) {
  const m = MEMBERS[name] || { streak: 0, group:'general', bio:'A member of the Renew community.', joined:'recently' };
  const g = groupById(m.group);
  c.appendChild(h('button', { class:'flex items-center gap-1 text-sm text-slate-400 hover:text-slate-600 mb-3', onclick:()=>cgo({screen: CV.gid?'group':'home', gid:CV.gid}) }, icon('home','w-4 h-4'), 'Back'));

  c.appendChild(card(
    h('div', { class:'flex items-center gap-4' },
      h('div', { class:'w-16 h-16 rounded-2xl grid place-items-center text-white text-2xl font-bold', style:`background:${avatarColor(name)}` }, name[0].toUpperCase()),
      h('div', { class:'flex-1' },
        h('div', { class:'text-xl font-extrabold' }, name),
        h('div', { class:'text-xs text-slate-400' }, 'Joined '+m.joined+' \u00b7 '+g.name),
        h('div', { class:'flex items-center gap-2 mt-2' },
          pill('\uD83D\uDD25 '+m.streak+' day streak','bg-orange-100 dark:bg-orange-900/30 text-orange-600 dark:text-orange-300'),
          pill(g.emoji+' '+g.name,'bg-slate-100 dark:bg-slate-800 text-slate-500')))),
    h('p', { class:'text-sm mt-4 text-slate-600 dark:text-slate-300' }, m.bio)));

  // Recovery journey / milestones
  c.appendChild(h('h2', { class:'text-sm font-bold mt-5 mb-2' }, 'Recovery journey'));
  const milestones = [
    [1,'First clean day','\uD83C\uDF31'], [7,'One week','\uD83D\uDD25'], [30,'One month','\uD83C\uDFC6'], [90,'90 days','\uD83D\uDC8E'], [180,'Six months','\u2B50'], [365,'One year','\uD83D\uDC51']
  ].filter(([d]) => true);
  const tl = h('div', { class:'space-y-0' });
  milestones.forEach(([d,label,emoji], i) => {
    const reached = m.streak >= d;
    tl.appendChild(h('div', { class:'flex items-start gap-3' },
      h('div', { class:'flex flex-col items-center' },
        h('div', { class:`w-9 h-9 rounded-full grid place-items-center text-base ${reached?'':'opacity-30 grayscale'}`, style:`background:${reached?g.color+'22':'transparent'}` }, emoji),
        i < milestones.length-1 ? h('div', { class:`w-0.5 h-8 ${reached?'':'opacity-30'}`, style:`background:${g.color}` }) : null),
      h('div', { class:`pb-4 ${reached?'':'opacity-40'}` },
        h('div', { class:'text-sm font-bold' }, label),
        h('div', { class:'text-xs text-slate-400' }, reached ? 'Achieved \u2713' : `Day ${d}`))));
  });
  c.appendChild(card(tl));
}

VIEWS.academy = (c) => {
  // Init state if missing
  S.academy = S.academy || { xp: 0, completedLessons: {}, certificates: [] };
  
  const totalLessons = ACADEMY_COURSES.reduce((sum, co) => sum + co.lessons.length, 0);
  const doneCount = Object.keys(S.academy.completedLessons).length;
  const progressPct = totalLessons ? Math.round((doneCount / totalLessons) * 100) : 0;

  // Header Dashboard
  const dash = h('div', { class: 'grid grid-cols-1 sm:grid-cols-3 gap-4 mb-8' },
    card(
      h('div', { class: 'flex items-center gap-3 mb-2 text-indigo-600 dark:text-indigo-400' }, icon('book', 'w-5 h-5'), h('h3', { class: 'font-bold' }, 'Learning Progress')),
      h('div', { class: 'text-3xl font-extrabold mb-2' }, `${progressPct}%`),
      h('div', { class: 'w-full h-2 bg-slate-100 dark:bg-slate-800 rounded-full overflow-hidden' },
        h('div', { class: 'h-full bg-indigo-500 transition-all', style: `width: ${progressPct}%` })
      ),
      h('div', { class: 'text-xs text-slate-400 mt-2' }, `${doneCount} of ${totalLessons} lessons completed`)
    ),
    card(
      h('div', { class: 'flex items-center gap-3 mb-2 text-amber-500' }, icon('spark', 'w-5 h-5'), h('h3', { class: 'font-bold' }, 'Academy XP')),
      h('div', { class: 'text-3xl font-extrabold mb-1' }, fmt(S.academy.xp)),
      h('div', { class: 'text-xs text-slate-400' }, 'Earn XP by passing quizzes')
    ),
    card(
      h('div', { class: 'flex items-center gap-3 mb-2 text-emerald-600 dark:text-emerald-400' }, icon('award', 'w-5 h-5'), h('h3', { class: 'font-bold' }, 'Certificates')),
      h('div', { class: 'text-3xl font-extrabold mb-1' }, S.academy.certificates.length),
      h('div', { class: 'text-xs text-slate-400' }, 'Complete courses to earn')
    )
  );

  c.append(
    h('h1', { class: 'text-2xl font-extrabold mb-1' }, 'Recovery University'),
    h('p', { class: 'text-slate-500 text-sm mb-6' }, 'Master the psychology and neuroscience of habit change.'),
    dash,
    h('h2', { class: 'text-lg font-bold mb-4' }, 'Curriculum')

function testCoachConnection() {
  const url = (S && S.settings && S.settings.coachServerUrl) ? S.settings.coachServerUrl.trim() : '';

  const endpoint = url.replace(/\/$/, '') + '/health';
  toast('Testing coach connection…', 'book');
  fetch(endpoint, { method: 'GET' }).then(r => {
    if (!r.ok) throw new Error('Bad response');
    return r.json();
  }).then(j => { toast('Coach server reachable','check'); }).catch(e => { toast('Coach server test failed: '+(e.message||e),'alert'); });

function importDataModal() {
  modal((close) => {
    const root = h('div', { class: 'p-4' });
    const ta = h('textarea', { id: 'import-area', class: 'w-full h-44 rounded-2xl border border-slate-300 dark:border-slate-700 bg-transparent px-4 py-3 resize-none', placeholder: 'Paste the exported JSON here to restore or merge.' });
    const hint = h('p', { class: 'text-xs text-slate-500 mt-2' }, 'Import replaces current local data. It is recommended to export a backup first.');
    const doImport = () => {
      const txt = ta.value.trim();
      if (!txt) { toast('Paste JSON to import','alert'); return; }
      let parsed = null;
      try { parsed = JSON.parse(txt); } catch (e) { toast('Invalid JSON — please check the file','alert'); return; }
      if (!confirm('Import will overwrite your current local data. Continue?')) return;
      try {
        // Merge parsed keys into S to preserve runtime references
        Object.keys(parsed).forEach(k => { S[k] = parsed[k]; });
        save();
        toast('Data imported — refreshing UI','check');
        close();
        render();
      } catch (e) { toast('Import failed: '+(e.message||e),'alert'); }
    };
    root.append(h('h2',{class:'text-lg font-bold mb-2'},'Import data'), h('p',{class:'text-sm text-slate-500 mb-3'},'Paste a previously exported JSON file from Ascendra.'), ta, hint, h('div',{class:'flex gap-3 mt-4'}, btn('Cancel', close, 'ghost'), btn('Import', doImport, 'primary')));
    return root;
  }, { wide: false });
}

/* ---- State migration for new modules ---- */
function migrate() {
  S.cstate  = S.cstate  || { joined: [], posts: {} };
  if (!S.cstate.posts) S.cstate.posts = {};
  S.academy = S.academy || { xp: 0, completedLessons: {}, certificates: [] };
  S.video   = S.video   || { favorites: [], history: [], progress: {} };
  // Ensure settings for video manager and community cap exist
  S.settings = S.settings || { anonymous: true, accountabilityName: '', accountabilityContact: '', notifications: true };
  if (!Array.isArray(S.settings.videoList)) S.settings.videoList = VIDEOS.slice();
  if (typeof S.settings.communityCap !== 'number') S.settings.communityCap = 10;
  if (typeof S._seenIntro !== 'boolean') S._seenIntro = false;
  if (typeof S._sawFileBanner !== 'boolean') S._sawFileBanner = false;
  // optional self-hosted coach proxy settings
  if (typeof S.settings.coachServerUrl !== 'string') S.settings.coachServerUrl = '';
  if (typeof S.settings.coachApiSecret !== 'string') S.settings.coachApiSecret = '';
  if (typeof S.settings.coachConsent !== 'boolean') S.settings.coachConsent = false;
}

/* ---- Account / auth persistence ---- */
const ACC_KEY = 'ascendra.account';
function getAccount() { try { return JSON.parse(localStorage.getItem(ACC_KEY)); } catch { return null; } }
function setAccount(a) { localStorage.setItem(ACC_KEY, JSON.stringify(a)); }
function signOut() {
  if (!confirm('Sign out of Ascendra? Your recovery data stays safely on this device.')) return;
  localStorage.removeItem(ACC_KEY);
  location.reload();
}

/* ---- Boot orchestration: splash -> auth/app ---- */
function boot() {
  runSplash(function () {
    const acc = getAccount();
    // show a helpful notice when users open the app via file:// (iframes/embeds often fail)
    try { showFileBanner(); } catch (e) {}
    if (acc && acc.signedIn) render();
    else renderAuth();
  });
}

function runSplash(cb) {
  const sp = document.getElementById('boot-splash');
  if (!sp) { cb(); return; }
  const bar = document.getElementById('splash-bar');
  const pct = document.getElementById('splash-pct');
  const msg = document.getElementById('splash-msg');
  const steps = ['Preparing your space', 'Loading your journey', 'Syncing progress', 'Almost there'];
  let p = 0;
  const t = setInterval(() => {
    p = Math.min(100, p + Math.random() * 11 + 5);
    if (bar) bar.style.width = p + '%';
    if (pct) pct.textContent = Math.round(p) + '%';
    if (msg) msg.textContent = steps[Math.min(steps.length - 1, Math.floor(p / 25))];
    if (p >= 100) {
      clearInterval(t);
      setTimeout(() => {
        sp.style.opacity = '0';
        sp.style.pointerEvents = 'none';
        setTimeout(() => { sp.remove(); cb(); }, 550);
      }, 380);
    }
  }, 135);
}

// Show a small banner if the app is opened via `file:` to help users run a local HTTP server.
function showFileBanner() {
  try {
    if (location && location.protocol !== 'file:') return;
    if (S && S._sawFileBanner) return;
  } catch (e) { return; }
  const app = document.getElementById('app') || document.body;
  const bar = document.createElement('div');
  bar.className = 'file-banner fixed top-4 left-1/2 -translate-x-1/2 z-50 w-[min(980px,96%)] rounded-2xl p-3 flex items-center gap-3 shadow-lg bg-yellow-50 text-yellow-900';
  bar.style.boxShadow = '0 8px 30px rgba(15,23,42,.12)';
  bar.innerHTML = `<div class="flex-1 text-sm">Notice: You opened Ascendra from your file system (<code>file://</code>). Video embeds (YouTube/Vimeo) may not load correctly. To view reliably, serve this folder over HTTP.</div>`;
  const copyBtn = document.createElement('button'); copyBtn.className = 'btn copy'; copyBtn.textContent = 'Copy server command';
  copyBtn.onclick = async () => { try { await navigator.clipboard.writeText('python -m http.server 8000'); toast('Command copied to clipboard', 'check'); } catch (e) { showServerCommandModal('python -m http.server 8000'); } };
  const dismiss = document.createElement('button'); dismiss.className = 'btn dismiss'; dismiss.textContent = "Don't show again";
  dismiss.onclick = () => { S._sawFileBanner = true; save(); bar.remove(); };
  const close = document.createElement('button'); close.className = 'btn close'; close.textContent = 'Dismiss'; close.onclick = () => bar.remove();
  const controls = document.createElement('div'); controls.className = 'flex gap-2'; controls.appendChild(copyBtn); controls.appendChild(dismiss); controls.appendChild(close);
  bar.appendChild(controls);
  document.body.appendChild(bar);
}

// Show a small modal with the server command and a copy button (fallback for older browsers)
function showServerCommandModal(cmd) {
  modal((close) => {
    const root = h('div', { class: 'p-4' });
    const pre = h('pre', { class: 'rounded-2xl p-3 bg-slate-100 dark:bg-slate-800 text-sm overflow-x-auto' }, cmd);
    const copy = () => { try { navigator.clipboard.writeText(cmd); toast('Command copied', 'check'); } catch (e) { toast('Copy failed — select and copy manually', 'alert'); } };
    root.append(h('h3',{class:'text-lg font-bold mb-2'},'Run a local HTTP server'), h('p',{class:'text-sm text-slate-500 mb-3'},'If embeds fail when opening the file, run this command in the project folder:'), pre, h('div',{class:'flex gap-3 mt-4'}, btn('Copy command', copy, 'primary'), btn('Close', close, 'ghost')));
    return root;
  }, { wide: false });
}

/* ---- Auth screen (Gmail sign-in + email sign-up) ---- */
let authMode = 'signup';
function renderAuth() {
  const app = document.getElementById('app');
  app.innerHTML = '';

  const valueProps = [
    ['flame', 'Track every streak', 'Watch your urge-free days, money saved, and time reclaimed grow.'],
    ['coach', 'A coach in your pocket', 'Personalized guidance and urge support, available 24/7.'],
    ['users', 'A community that gets it', 'Join recovery groups, share wins, and never feel alone.'],
  ];

  // Brand panel (left on desktop, top on mobile)
  const brand = h('div', { class: 'auth-brand relative overflow-hidden md:w-[44%] shrink-0 p-8 sm:p-12 flex flex-col justify-between text-white' },
    h('div', {},
      h('div', { class: 'flex items-center gap-3' },
        h('div', { class: 'w-11 h-11 rounded-2xl grid place-items-center', html: ascendMarkSVG(26) }),
        h('div', { class: 'text-2xl font-extrabold tracking-tight' }, 'ASCENDRA')),
      h('div', { class: 'mt-8 sm:mt-12 max-w-sm' },
        h('h1', { class: 'text-3xl sm:text-4xl font-extrabold leading-tight' }, 'Rise above. Reclaim your life.'),
        h('p', { class: 'text-white/75 mt-3 text-sm leading-relaxed' }, 'Small victories. Lasting freedom. Your journey beyond addiction starts the moment you sign in.'))),
    h('div', { class: 'hidden md:flex flex-col gap-4 mt-8' },
      valueProps.map(([ic, t, d]) => h('div', { class: 'flex items-start gap-3' },
        h('div', { class: 'w-9 h-9 rounded-xl bg-white/15 grid place-items-center shrink-0' }, icon(ic, 'w-5 h-5')),
        h('div', {}, h('div', { class: 'font-bold text-sm' }, t), h('div', { class: 'text-xs text-white/70' }, d))))));

  // Form panel
  const fields = h('div', { class: 'space-y-3' });
  const title = h('h2', { class: 'text-2xl font-extrabold tracking-tight' }, 'Create your account');
  const sub = h('p', { class: 'text-sm text-slate-500 mt-1' }, 'Start your recovery journey in under a minute.');

  const nameInput  = authInput('Full name', 'text', 'pen');
  const emailInput = authInput('Email address', 'email', 'coach');
  const passInput  = authInput('Password', 'password', 'lock');

  const errEl = h('div', { class: 'text-xs text-rose-500 font-medium min-h-[1rem]' });

  const googleBtn = h('button', { class: 'w-full flex items-center justify-center gap-3 rounded-2xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900 px-4 py-3 text-sm font-semibold hover:bg-slate-50 dark:hover:bg-slate-800 transition active:scale-[.98]', onclick: googleAuth },
    h('span', { class: 'grid place-items-center', html: '' }), 'Continue with Google');
  googleBtn.firstChild.appendChild(googleG(18));

  const submitBtn = h('button', { class: 'auth-submit w-full rounded-2xl px-4 py-3 text-sm font-bold text-white transition active:scale-[.98]' }, 'Create account');

  const toggle = h('button', { class: 'text-sm text-slate-500' });

  function paintMode() {
    fields.innerHTML = '';
    if (authMode === 'signup') {
      title.textContent = 'Create your account';
      sub.textContent = 'Start your recovery journey in under a minute.';
      submitBtn.textContent = 'Create account';
      fields.append(nameInput.wrap, emailInput.wrap, passInput.wrap);
      toggle.innerHTML = 'Already have an account? <span class="font-bold text-emerald-600">Sign in</span>';
    } else {
      title.textContent = 'Welcome back';
      sub.textContent = 'Sign in to continue your journey.';
      submitBtn.textContent = 'Sign in';
      fields.append(emailInput.wrap, passInput.wrap);
      toggle.innerHTML = "New to Ascendra? <span class=\"font-bold text-emerald-600\">Create an account</span>";
    }
    errEl.textContent = '';
  }
  toggle.onclick = () => { authMode = authMode === 'signup' ? 'login' : 'signup'; paintMode(); };

  function submit() {
    const email = emailInput.input.value.trim();
    const pass  = passInput.input.value;
    const name  = authMode === 'signup' ? nameInput.input.value.trim() : (email.split('@')[0] || 'friend');
    if (authMode === 'signup' && !name) { errEl.textContent = 'Please enter your name.'; return; }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { errEl.textContent = 'Please enter a valid email address.'; return; }
    if (!pass || pass.length < 6) { errEl.textContent = 'Password must be at least 6 characters.'; return; }
    finishAuth(email, prettyName(name));
  }
  submitBtn.onclick = submit;
  passInput.input.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });

  const formCard = h('div', { class: 'w-full max-w-sm' },
    title, sub,
    h('div', { class: 'mt-6 space-y-3' },
      googleBtn,
      h('div', { class: 'flex items-center gap-3 my-1' },
        h('div', { class: 'flex-1 h-px bg-slate-200 dark:bg-slate-800' }),
        h('span', { class: 'text-xs text-slate-400' }, 'or'),
        h('div', { class: 'flex-1 h-px bg-slate-200 dark:bg-slate-800' })),
      fields, errEl, submitBtn,
      h('div', { class: 'text-center pt-1' }, toggle),
      h('p', { class: 'text-[11px] text-slate-400 text-center leading-snug pt-2' },
        'Demo sign-in for this prototype \u2014 your data stays on this device. Ascendra is a wellness tool, not medical care.')));

  const form = h('div', { class: 'flex-1 grid place-items-center p-6 sm:p-10 bg-ink-50 dark:bg-ink-900' }, formCard);

  app.appendChild(h('div', { class: 'auth-wrap min-h-dvh flex flex-col md:flex-row' }, brand, form));
  app.appendChild(themeToggleFloating());
  paintMode();
}

function authInput(placeholder, type, ic) {
  const input = h('input', { type, placeholder, class: 'w-full bg-transparent outline-none text-sm' });
  const wrap = h('label', { class: 'flex items-center gap-3 rounded-2xl border border-slate-300 dark:border-slate-700 px-4 py-3 focus-within:ring-2 focus-within:ring-emerald-500 transition bg-white dark:bg-slate-900' },
    icon(ic, 'w-4 h-4 text-slate-400'), input);
  return { wrap, input };
}
function prettyName(n) { return n.charAt(0).toUpperCase() + n.slice(1); }

function googleAuth() {
  modal((close) => {
    const wrap = h('div', { class: 'p-6' });
    const emailIn = h('input', { type: 'email', placeholder: 'you@gmail.com', value: '', class: 'w-full rounded-2xl border border-slate-300 dark:border-slate-700 bg-transparent px-4 py-3 text-sm outline-none focus:ring-2 focus:ring-emerald-500' });
    function choose(email) {
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { toast('Enter a valid email', 'x'); return; }
      close(); finishAuth(email, prettyName(email.split('@')[0]));
    }
    wrap.append(
      h('div', { class: 'flex items-center gap-2 mb-4' }, h('span', { class: 'grid place-items-center', html: '' }), h('span', { class: 'text-sm text-slate-500' }, 'Sign in with Google')),
      h('div', { class: 'text-lg font-bold' }, 'Choose an account'),
      h('div', { class: 'text-xs text-slate-400 mb-4' }, 'to continue to Ascendra'),
      h('button', { class: 'w-full flex items-center gap-3 p-3 rounded-2xl hover:bg-slate-50 dark:hover:bg-slate-800 transition text-left', onclick: () => choose('alex.recovery@gmail.com') },
        h('div', { class: 'w-9 h-9 rounded-full bg-emerald-500 text-white grid place-items-center font-bold' }, 'A'),
        h('div', {}, h('div', { class: 'text-sm font-semibold' }, 'Alex'), h('div', { class: 'text-xs text-slate-400' }, 'alex.recovery@gmail.com'))),
      h('div', { class: 'h-px bg-slate-200 dark:bg-slate-800 my-3' }),
      h('div', { class: 'text-xs text-slate-400 mb-2' }, 'Use another account'),
      emailIn,
      h('div', { class: 'flex justify-end mt-4' }, btn('Continue', () => choose(emailIn.value.trim()), 'primary')));
    wrap.firstChild.firstChild.appendChild(googleG(18));
    return wrap;
  });
}

function finishAuth(email, name) {
  setAccount({ email, name, signedIn: true, ts: Date.now() });
  if (!S.profile.name && name) { S.profile.name = name; save(); }
  confetti();
  toast('Welcome to Ascendra, ' + (name || 'friend') + ' \uD83D\uDE4C', 'check');
  render();
}

/* ---- Ascend mark (logo) as inline SVG string ---- */
function ascendMarkSVG(size) {
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="${size}" height="${size}"><path d="M10 30 L24 16 L38 30" fill="none" stroke="white" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M14 38 L24 28 L34 38" fill="none" stroke="white" stroke-opacity=".6" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}

/* ---- Dashboard summary cards: AI Coach, Community, Learning ---- */
function dashCards() {
  const joined = (S.cstate && S.cstate.joined) || [];
  let myPosts = 0;
  if (S.cstate && S.cstate.posts) Object.values(S.cstate.posts).forEach(arr => arr.forEach(p => { if (p.mine) myPosts++; }));
  const totalLessons = (typeof ACADEMY_COURSES !== 'undefined') ? ACADEMY_COURSES.reduce((a, co) => a + co.lessons.length, 0) : 0;
  const doneLessons = (S.academy) ? Object.keys(S.academy.completedLessons || {}).length : 0;
  const lp = totalLessons ? Math.round(doneLessons / totalLessons * 100) : 0;

  return h('div', { class: 'grid sm:grid-cols-3 gap-4 mt-4' },
    h('button', { class: 'card text-left rounded-3xl p-5 text-white relative overflow-hidden', style: 'background:linear-gradient(135deg,#1e3a8a,#0f172a)', onclick: () => go('coach') },
      h('div', { class: 'absolute -right-6 -bottom-6 opacity-15' }, icon('coach', 'w-28 h-28')),
      h('div', { class: 'flex items-center gap-2 mb-2' }, h('div', { class: 'w-9 h-9 rounded-xl bg-white/15 grid place-items-center' }, icon('coach', 'w-5 h-5')), h('span', { class: 'font-bold text-sm' }, 'AI Coach')),
      h('p', { class: 'text-xs text-white/85 leading-relaxed' }, coachInsight()),
      h('div', { class: 'mt-3 text-[11px] font-bold bg-white/20 rounded-full px-3 py-1 inline-flex items-center gap-1' }, 'Open coach', icon('play', 'w-3 h-3'))),
    h('button', { class: 'card text-left rounded-3xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-5', onclick: () => go('community') },
      h('div', { class: 'flex items-center gap-2 mb-2' }, h('div', { class: 'text-purple-500' }, icon('users', 'w-5 h-5')), h('span', { class: 'font-bold text-sm' }, 'Community')),
      h('div', { class: 'text-3xl font-extrabold' }, String(joined.length)),
      h('div', { class: 'text-xs text-slate-400' }, joined.length ? 'groups joined \u00b7 ' + myPosts + ' posts' : 'Join your first group'),
      h('div', { class: 'mt-2 text-[11px] font-bold text-purple-500' }, joined.length ? 'View feed \u2192' : 'Explore \u2192')),
    h('button', { class: 'card text-left rounded-3xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-5', onclick: () => go('academy') },
      h('div', { class: 'flex items-center gap-2 mb-2' }, h('div', { class: 'text-amber-500' }, icon('book', 'w-5 h-5')), h('span', { class: 'font-bold text-sm' }, 'Learning')),
      h('div', { class: 'text-3xl font-extrabold' }, lp + '%'),
      h('div', { class: 'w-full h-1.5 bg-slate-100 dark:bg-slate-800 rounded-full overflow-hidden mt-2' }, h('div', { class: 'h-full bg-amber-500 transition-all', style: 'width:' + lp + '%' })),
      h('div', { class: 'text-xs text-slate-400 mt-1' }, doneLessons + ' lessons done')));
}

function coachInsight() {
  const sd = streakDays();
  const why = S.profile.why || '';
  const risk = (typeof relapseRisk === 'function') ? relapseRisk() : 0;
  if (risk >= 60) return 'Your risk signals look elevated today. Let\u2019s do a 2-minute breathing reset and line up one safe next step \u2014 I\u2019ve got you.';
  if (sd === 0) return 'Day one is the bravest day. Let\u2019s pick one tiny win for the next hour \u2014 momentum beats motivation.';
  if (sd >= 1 && sd < 7) return sd + ' day' + (sd > 1 ? 's' : '') + ' in \u2014 your brain is already starting to rewire. Keep the streak alive with today\u2019s check-in.';
  if (why) return 'Remember your why: \u201c' + why + '\u201d. ' + sd + ' days of proof that you mean it. What can I help with right now?';
  return 'You\u2019re on day ' + sd + '. Tell me how you\u2019re really feeling and we\u2019ll plan the day together.';
}
